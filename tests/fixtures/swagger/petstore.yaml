swagger: "2.0"
info:
  title: Petstore Swagger
  version: "1.0.0"
host: api.example.com
basePath: /v1
schemes:
  - https
securityDefinitions:
  api_key:
    type: apiKey
    name: X-API-Key
    in: header
paths:
  /pets/{pet_id}:
    get:
      operationId: get_pet
      tags:
        - Pets
      parameters:
        - name: pet_id
          in: path
          required: true
          type: integer
      responses:
        "200":
          description: A pet
          schema:
            $ref: "#/definitions/Pet"
  /pets:
    post:
      operationId: create_pet
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/PetInput"
      responses:
        "201":
          description: Created
definitions:
  Pet:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
  PetInput:
    type: object
    required:
      - name
    properties:
      name:
        type: string
