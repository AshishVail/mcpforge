name: example-api

source:
  location: https://api.example.com/openapi.json
  format: openapi
  base_url: https://api.example.com
  timeout_seconds: 30

auth:
  type: bearer
  token:
    env: MCPFORGE_API_TOKEN
    required: true

filters:
  include_paths:
    - /users
    - /users/*
  exclude_paths:
    - /admin/*
    - /internal/*
  include_tags:
    - Users
  exclude_tags:
    - Internal
  methods:
    - GET
  include_deprecated: false

security:
  allow_write_operations: false
  allow_delete_operations: false
  allowed_hosts:
    - api.example.com
  block_private_networks: true
  max_response_bytes: 5000000

http:
  timeout_seconds: 30
  verify_tls: true
  retry:
    max_attempts: 3
    backoff_seconds: 0.5
