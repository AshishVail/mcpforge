openapi: 3.0.3
info:
  title: Petstore API
  version: "1.0.0"
  description: Example API used by MCPForge documentation and tests.

servers:
  - url: https://petstore.example.com/v1

tags:
  - name: Pets
    description: Pet operations

paths:
  /pets:
    get:
      operationId: list_pets
      summary: List pets
      tags:
        - Pets
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A list of pets.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Pet"
                  next_cursor:
                    type: string
                    nullable: true

    post:
      operationId: create_pet
      summary: Create a pet
      tags:
        - Pets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetInput"
      responses:
        "201":
          description: Pet created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"

  /pets/{pet_id}:
    get:
      operationId: get_pet
      summary: Get a pet
      tags:
        - Pets
      parameters:
        - name: pet_id
          in: path
          description: Pet identifier.
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pet details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Pet not found.

    delete:
      operationId: delete_pet
      summary: Delete a pet
      tags:
        - Pets
      parameters:
        - name: pet_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Pet deleted.

components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
          enum:
            - available
            - pending
            - sold
        tags:
          type: array
          items:
            type: string

    PetInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - available
            - pending
            - sold
        tags:
          type: array
          items:
            type: string
